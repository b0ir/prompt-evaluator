[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-evaluator"
version = "0.1.0"
description = "Evaluate any prompt: score, dimension breakdown, suggestions, and an improved rewrite. Model-agnostic via LiteLLM."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140.13",
    "uvicorn[standard]>=0.51.0",
    "litellm>=1.95.0",
    "python-dotenv>=1.2.2",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "pip-audit>=2.10.1",
]

[project.urls]
Repository = "https://github.com/b0ir/prompt-evaluator"
Issues = "https://github.com/b0ir/prompt-evaluator/issues"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
